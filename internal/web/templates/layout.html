<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laptop-backup</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{{.Page}}" data-running="{{.Run.Running}}" data-connected="{{.Auth.Connected}}">
<header>
  <a class="brand" href="/">☁ laptop-backup</a>
  <nav>
    <a href="/" {{if eq .Page "dashboard"}}class="on"{{end}}>ภาพรวม</a>
    <a href="/history" {{if eq .Page "history"}}class="on"{{end}}>ประวัติ</a>
    <a href="/folders" {{if eq .Page "folders"}}class="on"{{end}}>โฟลเดอร์</a>
    <a href="/settings" {{if eq .Page "settings"}}class="on"{{end}}>ตั้งค่า</a>
    <a href="/logs" {{if eq .Page "logs"}}class="on"{{end}}>บันทึก</a>
  </nav>
</header>
<main>
  {{if .Msg}}<div class="flash ok">{{.Msg}}</div>{{end}}
  {{if .Err}}<div class="flash bad">{{.Err}}</div>{{end}}
  <div id="toast" class="flash" hidden></div>
  {{template "content" .}}
</main>
{{if eq .Page "dashboard"}}<script src="/static/charts.js"></script>
{{end}}<script src="/static/app.js"></script>
</body>
</html>
